name: Android screenshot-protection check

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  flag-secure-scan:
    name: Bytecode scan every Android build variant
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK (aapt2 + dexdump)
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: |
          sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble all Android variants
        working-directory: android
        run: ./gradlew assemble --stacktrace

      - name: List built APKs
        id: apks
        run: |
          mapfile -t apks < <(find android/app/build/outputs/apk -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APKs produced — cannot verify screenshot protection." >&2
            exit 1
          fi
          printf '%s\n' "${apks[@]}"
          printf 'list=%s\n' "${apks[*]}" >> "$GITHUB_OUTPUT"

      - name: Verify SecureApplication / FLAG_SECURE in every variant
        run: ./scripts/verify-flag-secure.sh ${{ steps.apks.outputs.list }}

      - name: Upload scanned APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
