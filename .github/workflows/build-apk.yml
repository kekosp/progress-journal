name: Build Android APK

# Builds an installable APK entirely in the cloud — no PC required.
# Run it from GitHub: Actions -> "Build Android APK" -> Run workflow.
# The APK is attached to the run as an artifact you can download on your phone.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 6.3.3)'
        required: true
        default: '6.3.3'
      version_code:
        description: 'Version code (integer, must increase each build)'
        required: true
        default: '60303'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Set version ${{ inputs.version_name }} (${{ inputs.version_code }})
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 to repository Actions secrets before building."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/reports-keystore.jks
          test -s android/reports-keystore.jks

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android/reports-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required Android signing secret is missing: $name"
              exit 1
            fi
          done
          if [ ! -s "$RELEASE_STORE_FILE" ]; then
            echo "::error::The Android signing key file was not restored."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/reports-keystore.jks

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/reports-v${{ inputs.version_name }}.apk"
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: reports-v${{ inputs.version_name }}-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Reports v${{ inputs.version_name }}
          files: out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}